name: Validate Skills

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run validator tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Validate skill quality
        run: python3 scripts/validate_skill_quality.py

      - name: Check skill language
        run: python3 scripts/check_skill_language.py

      - name: Check skill closure
        run: python3 scripts/check_skill_closure.py

      - name: Check reference neutrality
        run: python3 scripts/check_reference_neutrality.py

      - name: Check harness profile consistency
        run: python3 scripts/check_profile_consistency.py

      - name: Validate plugin metadata
        run: python3 scripts/validate_plugin_metadata.py

      - name: Check OpenCode plugin entrypoint
        run: node --check .opencode/plugins/agent-harness-skills.js

      - name: Build plugin archive
        run: |
          mkdir -p dist/plugin
          git archive --format=zip --output=dist/agent-harness-skills.zip HEAD
          python3 -m zipfile -e dist/agent-harness-skills.zip dist/plugin

      - name: Validate unpacked plugin contents
        run: python3 scripts/check_plugin_package.py dist/plugin --source .

      - name: Run advertised validation from unpacked plugin
        run: npm --prefix dist/plugin run validate

      - name: Upload validated plugin archive
        uses: actions/upload-artifact@v4
        with:
          name: agent-harness-skills-plugin
          path: dist/agent-harness-skills.zip
